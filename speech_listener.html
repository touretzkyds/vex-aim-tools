<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Listener for VEX AIM</title>
    <style>
      .controls-row {
          display: flex;
          align-items: center;
          gap: 12px;
          margin-bottom: 12px;
      }

      .switch3 {
          position: relative;
          display: inline-block;
          width: 80px;
          height: 28px;
          flex: none;
          border-radius: 28px;
          cursor: pointer;
          background-color: red;
          transition: background-color .2s;
      }

      .switch3[data-mode="edit"] {
          background-color: #e6c200;
      }

      .switch3[data-mode="ptt"] {
          background-color: green;
      }

      .switch3-knob {
          position: absolute;
          top: 3px;
          left: 3px;
          width: 22px;
          height: 22px;
          background-color: white;
          border-radius: 50%;
          transition: transform .2s;
      }

      .switch3-label {
          position: absolute;
          top: 32px;
          left: 0;
          width: 100%;
          text-align: center;
          font-size: 16px;
          font-weight: bold;
          color: #333;
          pointer-events: none;
      }

      .switch3[data-mode="edit"] .switch3-knob {
          transform: translateX(26px);
      }

      .switch3[data-mode="ptt"] .switch3-knob {
          transform: translateX(52px);
      }

      .round-button {
          width: 90px;
          height: 90px;
          border-radius: 50%;
          border: none;
          cursor: pointer;
          font-weight: normal;
          font-size: 20px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          line-height: 1.2;
          padding: 4px;
      }

      .live-mic-button {
          border: none;
          background-color: white;
          border-radius: 8px;
          padding: 4px;
          cursor: pointer;
          display: inline-flex;
          flex: none;
      }

      .live-mic-icon {
          height: 80px;
          width: 82px;
          flex: none;
      }

      .ptt-pointer {
          width: 48px;
          height: auto;
          flex: none;
          position: relative;
          z-index: 1;
          transform: translate(-25px, 5px);
      }

      .reset-button {
          border: 3px solid #ff4d00;
          background-color: white;
          color: #ff4d00;
          font-weight: bold;
          font-size: 26px;
          margin-left: 60px;
          box-shadow: 0 0 0 4px white, 0 0 0 7px #ff4d00;
      }

      .reset-button span {
          display: block;
          transform: translateY(3px);
      }

      .text-row {
          display: flex;
          align-items: center;
          gap: 12px;
          margin-bottom: 12px;
      }

      .send-button {
          height: 50px;
          border-radius: 12px;
          background-color: #1565c0;
          color: white;
          font-weight: bold;
      }

      #textInput {
          width: 500px;
          font-size: 16px;
          padding: 4px 8px;
          box-sizing: border-box;
          resize: vertical;
      }

      .transcript-header {
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 4px;
      }

      .transcript-label {
          font-weight: bold;
      }

      .copy-button {
          border: none;
          background: none;
          cursor: pointer;
          padding: 2px;
          display: inline-flex;
          color: #333;
      }

      .copy-button svg {
          width: 18px;
          height: 18px;
      }

      .copy-button:hover {
          color: #000;
      }

      #consoleLog {
          width: 500px;
          height: 300px;
          overflow-y: auto;
          border: 2px solid #888;
          border-radius: 4px;
          background-color: #f7f7f7;
          font-family: monospace;
          font-size: 13px;
          padding: 6px 8px;
          box-sizing: border-box;
          white-space: pre-wrap;
          margin-bottom: 12px;
      }

      #consoleLogPlaceholder {
          color: #888;
          font-style: italic;
      }
    </style>
  </head>
  <body>
    <h1>Speech Listener for VEX AIM</h1>
    <div class="controls-row">
      <button id="liveMicButton" class="live-mic-button" aria-label="Mic Active">
        <svg class="live-mic-icon" viewBox="0 0 130 128" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <title>Mic Active</title>
          <path d="M94,8 C92.42,8.48 87.92,7.56 84.5,10.85 C81.08,14.14 76.25,21.9 73.5,27.75 C70.75,33.6 71.58,39.88 68,45.95 C64.42,52.02 52.67,59.82 52,64.15 C51.33,68.48 63,69.35 64,71.95 C65,74.55 57,77.58 58,79.75 C59,81.92 70,82.78 70,84.95 C70,87.12 58.67,89.28 58,92.75 C57.33,96.22 59.67,101.85 66,105.75 C72.33,109.65 91,114.42 96,116.15" />
          <circle cx="84" cy="39" r="4.5" fill="currentColor" />
          <text x="26" y="22" font-family="sans-serif" font-size="18" font-weight="600" fill="currentColor" stroke="none" text-anchor="middle"><tspan x="26" dy="0">Live</tspan><tspan x="26" dy="20">Mic</tspan></text>
          <path d="M42.71,69.74 Q31.29,82 42.71,94.26" stroke-width="3" />
          <path d="M37.57,63.62 Q20.43,82 37.57,100.38" stroke-width="3" />
          <path d="M32.42,57.49 Q9.58,82 32.42,106.51" stroke-width="3" />
        </svg>
      </button>
      <div class="switch3" id="modeSwitch" data-mode="live" tabindex="0" role="slider"
           aria-label="Input mode: Live Mic, Edit, Push to Talk" aria-valuemin="0" aria-valuemax="2" aria-valuenow="0">
        <div class="switch3-knob"></div>
        <div class="switch3-label">Edit</div>
      </div>
      <button id="pttButton" class="round-button" style="background-color: lime">
        <span>Push</span><span>to</span><span>Talk</span>
      </button>
      <img class="ptt-pointer" src="/ptt_pointer.png" alt="" aria-hidden="true">
      <button id="resetButton" class="round-button reset-button">
        <span>Reset</span><span>FSM</span>
      </button>
      <button id="uploadButton" class="round-button">
        <span>Load</span><span>File</span>
      </button>
      <input type="file" id="fileInput" accept=".txt,.md,.markdown,.pdf,text/plain,text/markdown,application/pdf" style="display: none">
    </div>
    <div class="text-row">
      <textarea id="textInput" placeholder="Or type here and press Enter to send..." rows="3"></textarea>
      <button id="sendButton" class="round-button send-button" style="display: none">Send</button>
    </div>
    <div class="transcript-header">
      <div class="transcript-label">Transcript:</div>
      <button id="copyTranscriptButton" class="copy-button" title="Copy transcript" aria-label="Copy transcript">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>
    <div id="consoleLog"><div id="consoleLogPlaceholder">The conversation transcript will appear here.</div></div>
    <div id="result"></div>

    <script>
      const modeSwitch = document.getElementById('modeSwitch');
      const liveMicButton = document.getElementById('liveMicButton');
      const pttButton = document.getElementById('pttButton');
      const resetButton = document.getElementById('resetButton');
      const textInput = document.getElementById('textInput');
      const sendButton = document.getElementById('sendButton');
      const consoleLog = document.getElementById('consoleLog');
      const copyTranscriptButton = document.getElementById('copyTranscriptButton');
      const resultDiv = document.getElementById('result');
      const uploadButton = document.getElementById('uploadButton');
      const fileInput = document.getElementById('fileInput');

      const modeOrder = ['live', 'edit', 'ptt'];

      let recognition;
      let isRecording = false;
      let isPTT = false;
      let mode = 'live';

      // Get the number of milliseconds elapsed since the epoch (timestamp in milliseconds)
      function getTime () {
	  let date = new Date();
	  return date.getTime();
      }
      const sessionID = String(1000 + Math.round(8999 * Math.random())) + String(getTime());

      function sendSessionID() {
          fetch('http://127.0.0.1:51327/api/set-session-id', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ sessionID: sessionID })
          })
      }

      function checkSessionID() {
	  // Make sure we're still the active session.  If not, close the window.
          let response = fetch('http://127.0.0.1:51327/api/get-session-id', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' }
          }).then(response => response.json())
              .then(data => {
                  console.log('Backend response:', data);
		  let currentID = data['sessionID'];
		  if (sessionID != currentID) {
		      closeSession();
		  }
              });
      }

      function closeSession() {
	  try {
	      window.close();
	  } catch (exception) {}
	  window.location.href = 'http://127.0.0.1:51327/listener_closed.html';
      }

      function sendSpeechText(text) {
          console.log('Speech result:', text);
          fetch('http://127.0.0.1:51327/api/speech-to-text', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text: text })
          })
          .then(response => response.json())
          .then(data => { console.log('Backend response:', data); })
          .catch(error => { console.error('Error:', error); });
      }

      function appendConsoleMessage(text) {
          const placeholder = document.getElementById('consoleLogPlaceholder');
          if (placeholder) placeholder.remove();
          const atBottom = consoleLog.scrollHeight - consoleLog.scrollTop <= consoleLog.clientHeight + 4;
          const line = document.createElement('div');
          line.textContent = text;
          consoleLog.appendChild(line);
          if (atBottom) consoleLog.scrollTop = consoleLog.scrollHeight;
      }

      copyTranscriptButton.addEventListener('click', () => {
          const text = Array.from(consoleLog.children)
              .filter(el => el.id !== 'consoleLogPlaceholder')
              .map(el => el.textContent)
              .join('\n');
          navigator.clipboard.writeText(text).catch(error => console.error('Copy failed:', error));
      });

      function connectConsoleStream() {
          const eventSource = new EventSource('http://127.0.0.1:51327/api/console-stream');
          eventSource.onmessage = (event) => { appendConsoleMessage(event.data); };
          eventSource.onerror = (event) => { console.error('Console stream error:', event); };
      }

      function depositToTextInput(text) {
          if (!text) return;
          const current = textInput.value.trim();
          textInput.value = current ? current + ' ' + text : text;
      }

      function sendCurrentText() {
          const text = textInput.value.trim();
          if (text) {
              sendSpeechText(text);
              textInput.value = '';
          }
      }

      function initializeRecognition() {
	  if (! ('webkitSpeechRecognition' in window)) {
	      resultDiv.innerHTML = '<font size=+2 color="red"><b>Speech recognition not supported in this browser!</b></font>';
	      return;
	  };

          recognition = new webkitSpeechRecognition();
          recognition.continuous = true; // Enable continuous recognition
          recognition.interimResults = false;
          recognition.lang = 'en-US';

          recognition.onstart = function () {
              console.log('Speech recognition started');
          };

          recognition.onresult = function (event) {
              const speechResult = event.results[event.resultIndex][0].transcript;
              if (mode === 'edit') {
                  depositToTextInput(speechResult);
              } else {
                  sendSpeechText(speechResult);
              }
          };

          recognition.onerror = function (event) {
              console.error('Speech recognition error:', event.error);
              if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                  console.error('Microphone access denied');
              }
          };

          recognition.onend = function () {
              console.log('Speech recognition ended');
              if (isRecording || isPTT) {
                  console.log('Restarting speech recognition...');
                  recognition.start(); // Restart recognition if still recording or PTT held
              }
          };
      }

      function updatePTTButton() {
          if (isRecording) {
              pttButton.style.backgroundColor = 'gray';
              pttButton.style.color = '#000'; // black font so label stays visible on gray
          } else {
              const idleColor = mode === 'edit' ? '#e6c200' : 'lime';
              pttButton.style.backgroundColor = isPTT ? 'red' : idleColor;
              pttButton.style.color = '#000';
          }
      }

      function updateTextInputPlaceholder() {
          textInput.placeholder = mode === 'edit'
              ? 'Press the button to talk, then edit your text here.'
              : 'Or type here and press Enter to send...';
      }

      function updateSendButtonVisibility() {
          sendButton.style.display = mode === 'edit' ? '' : 'none';
      }

      function startRecording() {
          navigator.mediaDevices.getUserMedia({ audio: true })
              .then(stream => {
                  console.log('Microphone access granted');
                  if (!isRecording) {
                      if (!recognition) initializeRecognition();
                      recognition.start();
                      isRecording = true;
                  }
                  updatePTTButton();
              })
              .catch(error => {
                  console.error('Microphone access denied', error);
                  setMode('ptt'); // fall back to Push to Talk mode
              });
      }

      function stopRecording() {
          if (recognition && isRecording) {
              recognition.stop();
              isRecording = false;
          }
          updatePTTButton();
      }

      function updateLiveMicButton() {
          liveMicButton.style.backgroundColor = mode === 'live' ? 'red' : 'white';
      }

      function setMode(newMode) {
          if (mode === newMode) return;
          mode = newMode;
          modeSwitch.dataset.mode = mode;
          modeSwitch.setAttribute('aria-valuenow', String(modeOrder.indexOf(mode)));
          if (mode === 'live') {
              // Slid left: Live Mic mode
              startRecording();
          } else {
              // Slid middle (Edit) or right (Push to Talk): mic only listens while PTT is held
              stopRecording();
          }
          updateLiveMicButton();
          updateTextInputPlaceholder();
          updateSendButtonVisibility();
      }

      modeSwitch.addEventListener('click', (event) => {
          const rect = modeSwitch.getBoundingClientRect();
          const third = rect.width / 3;
          const relX = event.clientX - rect.left;
          const newMode = relX < third ? 'live' : (relX < 2 * third ? 'edit' : 'ptt');
          setMode(newMode);
      });

      modeSwitch.addEventListener('keydown', (event) => {
          const idx = modeOrder.indexOf(mode);
          if (event.key === 'ArrowLeft' && idx > 0) {
              setMode(modeOrder[idx - 1]);
              event.preventDefault();
          } else if (event.key === 'ArrowRight' && idx < modeOrder.length - 1) {
              setMode(modeOrder[idx + 1]);
              event.preventDefault();
          }
      });

      liveMicButton.addEventListener('click', () => {
          setMode('live');
      });

      uploadButton.addEventListener('click', () => fileInput.click());

      function showUploadStatus(message, isError = false) {
          const line = document.createElement('p');
          line.textContent = message;
          if (isError) line.style.color = 'red';
          resultDiv.appendChild(line);
      }

      fileInput.addEventListener('change', async () => {
          const file = fileInput.files[0];
          if (!file) return;
          const body = new FormData();
          body.append('file', file);
          const buttonContents = uploadButton.innerHTML;
          const controller = new AbortController();
          uploadButton.disabled = true;
          uploadButton.textContent = 'Loading…';
          const timeout = setTimeout(() => controller.abort(), 15 * 60 * 1000);
          try {
              const response = await fetch('/api/upload-script',
                                           { method: 'POST', body, signal: controller.signal });
              const responseText = await response.text();
              let result;
              try {
                  result = JSON.parse(responseText);
              } catch (_) {
                  throw new Error(`server returned ${response.status}: ${responseText || response.statusText}`);
              }
              if (!response.ok) throw new Error(result.error || `server returned ${response.status}`);
              const detail = result.kind === 'pdf'
                  ? `${result.sourceBytes} byte PDF indexed for retrieval`
                  : `${result.textBytes} bytes`;
              showUploadStatus(`Loaded ${result.name} (${detail})`);
          } catch (error) {
              showUploadStatus(error.name === 'AbortError'
                  ? 'Upload timed out. The document may be too large to index.'
                  : `Upload failed: ${error.message}`, true);
          } finally {
              clearTimeout(timeout);
              uploadButton.disabled = false;
              uploadButton.innerHTML = buttonContents;
              fileInput.value = '';
          }
      });

      resetButton.addEventListener('mousedown', () => {
          resetButton.style.backgroundColor = '#ff4d00';
          resetButton.style.color = 'white';
          fetch('http://127.0.0.1:51327/api/reset-fsm', { method: 'POST' });
      });

      document.addEventListener('mouseup', () => {
          resetButton.style.backgroundColor = 'white';
          resetButton.style.color = '#ff4d00';
      });

      pttButton.addEventListener('mousedown', () => {
          if (mode === 'live') {
              // Switch from Live Mic mode to PTT mode immediately, then start talking.
              setMode('ptt');
          }
          isPTT = true;
          pttButton.style.backgroundColor = 'red';
          if (!recognition) {
              navigator.mediaDevices.getUserMedia({ audio: true })
                  .then(stream => {
                      console.log('Microphone access granted');
                      initializeRecognition();
                      recognition.start();
                  })
                  .catch(error => {
                      console.error('Microphone access denied', error);
                      isPTT = false;
                      updatePTTButton();
                  });
          } else {
              try { recognition.start(); } catch (e) {}
          }
      });

      document.addEventListener('mouseup', () => {
          if (isPTT) {
              isPTT = false;
              updatePTTButton();
              if (recognition) recognition.stop();
          }
      });

      sendButton.addEventListener('click', () => {
          sendCurrentText();
      });

      textInput.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' && mode !== 'edit') {
              event.preventDefault(); // don't insert a newline into the textarea
              sendCurrentText();
          }
      });

      // Start up the speech listener service
      sendSessionID();
      setInterval(() => { checkSessionID(); }, 2000);
      connectConsoleStream();
      startRecording(); // default mode (slider left) is Record
      updateLiveMicButton();
      updateTextInputPlaceholder();
      updateSendButtonVisibility();

    </script>
  </body>
</html>
