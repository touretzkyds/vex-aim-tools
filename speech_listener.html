<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Listener for VEX AIM</title>
    <style>
      .controls-row {
          display: flex;
          align-items: center;
          gap: 12px;
          margin-bottom: 12px;
      }

      .switch-label {
          font-weight: bold;
      }

      .switch {
          position: relative;
          display: inline-block;
          width: 54px;
          height: 28px;
          flex: none;
      }

      .switch input {
          opacity: 0;
          width: 0;
          height: 0;
      }

      .switch .slider {
          position: absolute;
          cursor: pointer;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background-color: red;
          border-radius: 28px;
          transition: background-color .2s;
      }

      .switch .slider:before {
          position: absolute;
          content: "";
          height: 22px;
          width: 22px;
          left: 3px;
          bottom: 3px;
          background-color: white;
          border-radius: 50%;
          transition: transform .2s;
      }

      .switch input:checked + .slider {
          background-color: green;
      }

      .switch input:checked + .slider:before {
          transform: translateX(26px);
      }

      .round-button {
          width: 90px;
          height: 90px;
          border-radius: 50%;
          border: none;
          cursor: pointer;
          font-weight: normal;
          font-size: 20px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          line-height: 1.2;
          padding: 4px;
      }

      .live-mic-button {
          border: none;
          background-color: white;
          border-radius: 8px;
          padding: 4px;
          cursor: pointer;
          display: inline-flex;
          flex: none;
      }

      .live-mic-icon {
          height: 80px;
          width: 82px;
          flex: none;
      }

      .ptt-pointer {
          width: 48px;
          height: auto;
          flex: none;
          position: relative;
          z-index: 1;
          transform: translate(-25px, 5px);
      }

      .reset-button {
          border: 3px solid #ff4d00;
          background-color: white;
          color: #ff4d00;
          font-weight: bold;
          font-size: 26px;
          margin-left: 60px;
          box-shadow: 0 0 0 4px white, 0 0 0 7px #ff4d00;
      }

      #textInput {
          width: 500px;
          font-size: 16px;
          padding: 4px 8px;
          box-sizing: border-box;
          resize: vertical;
      }
    </style>
  </head>
  <body>
    <h1>Speech Listener for VEX AIM</h1>
    <div class="controls-row">
      <button id="liveMicButton" class="live-mic-button" aria-label="Mic Active">
        <svg class="live-mic-icon" viewBox="0 0 130 128" xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
          <title>Mic Active</title>
          <path d="M94,8 C92.42,8.48 87.92,7.56 84.5,10.85 C81.08,14.14 76.25,21.9 73.5,27.75 C70.75,33.6 71.58,39.88 68,45.95 C64.42,52.02 52.67,59.82 52,64.15 C51.33,68.48 63,69.35 64,71.95 C65,74.55 57,77.58 58,79.75 C59,81.92 70,82.78 70,84.95 C70,87.12 58.67,89.28 58,92.75 C57.33,96.22 59.67,101.85 66,105.75 C72.33,109.65 91,114.42 96,116.15" />
          <circle cx="84" cy="39" r="4.5" fill="currentColor" />
          <text x="26" y="22" font-family="sans-serif" font-size="18" font-weight="600" fill="currentColor" stroke="none" text-anchor="middle"><tspan x="26" dy="0">Live</tspan><tspan x="26" dy="20">Mic</tspan></text>
          <path d="M42.71,69.74 Q31.29,82 42.71,94.26" stroke-width="3" />
          <path d="M37.57,63.62 Q20.43,82 37.57,100.38" stroke-width="3" />
          <path d="M32.42,57.49 Q9.58,82 32.42,106.51" stroke-width="3" />
        </svg>
      </button>
      <label class="switch">
        <input type="checkbox" id="modeToggle">
        <span class="slider"></span>
      </label>
      <button id="pttButton" class="round-button" style="background-color: lime">
        <span>Push</span><span>to</span><span>Talk</span>
      </button>
      <img class="ptt-pointer" src="/ptt_pointer.png" alt="" aria-hidden="true">
      <button id="resetButton" class="round-button reset-button">
        <span>Reset</span><span>FSM</span>
      </button>
    </div>
    <textarea id="textInput" placeholder="Type here and press Enter to send..." rows="3"></textarea><p/>
    <div id="result"></div>

    <script>
      const modeToggle = document.getElementById('modeToggle');
      const liveMicButton = document.getElementById('liveMicButton');
      const pttButton = document.getElementById('pttButton');
      const resetButton = document.getElementById('resetButton');
      const textInput = document.getElementById('textInput');
      const resultDiv = document.getElementById('result');

      let recognition;
      let isRecording = false;
      let isPTT = false;
      let utterance_count = 0;

      // Get the number of milliseconds elapsed since the epoch (timestamp in milliseconds)
      function getTime () {
	  let date = new Date();
	  return date.getTime();
      }
      const sessionID = String(1000 + Math.round(8999 * Math.random())) + String(getTime());

      function sendSessionID() {
          fetch('http://127.0.0.1:51327/api/set-session-id', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ sessionID: sessionID })
          })
      }

      function checkSessionID() {
	  // Make sure we're still the active session.  If not, close the window.
          let response = fetch('http://127.0.0.1:51327/api/get-session-id', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' }
          }).then(response => response.json())
              .then(data => {
                  console.log('Backend response:', data);
		  let currentID = data['sessionID'];
		  if (sessionID != currentID) {
		      closeSession();
		  }
              });
      }

      function closeSession() {
	  try {
	      window.close();
	  } catch (exception) {}
	  window.location.href = 'http://127.0.0.1:51327/listener_closed.html';
      }

      function sendSpeechText(text) {
          utterance_count += 1;
          resultDiv.innerText = `Result ${utterance_count}: ${text}`;
          console.log('Speech result:', text);
          fetch('http://127.0.0.1:51327/api/speech-to-text', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text: text })
          })
          .then(response => response.json())
          .then(data => { console.log('Backend response:', data); })
          .catch(error => { console.error('Error:', error); });
      }

      function initializeRecognition() {
	  if (! ('webkitSpeechRecognition' in window)) {
	      resultDiv.innerHTML = '<font size=+2 color="red"><b>Speech recognition not supported in this browser!</b></font>';
	      return;
	  };

          recognition = new webkitSpeechRecognition();
          recognition.continuous = true; // Enable continuous recognition
          recognition.interimResults = false;
          recognition.lang = 'en-US';

          recognition.onstart = function () {
              console.log('Speech recognition started');
          };

          recognition.onresult = function (event) {
              const speechResult = event.results[event.resultIndex][0].transcript;
              sendSpeechText(speechResult);
          };

          recognition.onerror = function (event) {
              console.error('Speech recognition error:', event.error);
              if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                  console.error('Microphone access denied');
              }
          };

          recognition.onend = function () {
              console.log('Speech recognition ended');
              if (isRecording || isPTT) {
                  console.log('Restarting speech recognition...');
                  recognition.start(); // Restart recognition if still recording or PTT held
              }
          };
      }

      function updatePTTButton() {
          if (isRecording) {
              pttButton.style.backgroundColor = 'gray';
              pttButton.style.color = '#000'; // black font so label stays visible on gray
          } else {
              pttButton.style.backgroundColor = isPTT ? 'red' : 'lime';
              pttButton.style.color = '#000';
          }
      }

      function startRecording() {
          navigator.mediaDevices.getUserMedia({ audio: true })
              .then(stream => {
                  console.log('Microphone access granted');
                  if (!isRecording) {
                      if (!recognition) initializeRecognition();
                      recognition.start();
                      isRecording = true;
                  }
                  updatePTTButton();
              })
              .catch(error => {
                  console.error('Microphone access denied', error);
                  modeToggle.checked = true; // fall back to Push to Talk mode
                  updateLiveMicButton();
              });
      }

      function stopRecording() {
          if (recognition && isRecording) {
              recognition.stop();
              isRecording = false;
          }
          updatePTTButton();
      }

      function updateLiveMicButton() {
          liveMicButton.style.backgroundColor = modeToggle.checked ? 'white' : 'red';
      }

      modeToggle.addEventListener('change', () => {
          if (modeToggle.checked) {
              // Slid right: Push to Talk mode
              stopRecording();
          } else {
              // Slid left: Record mode
              startRecording();
          }
          updateLiveMicButton();
      });

      liveMicButton.addEventListener('click', () => {
          modeToggle.checked = false;
          modeToggle.dispatchEvent(new Event('change'));
      });

      resetButton.addEventListener('mousedown', () => {
          resetButton.style.backgroundColor = '#ff4d00';
          resetButton.style.color = 'white';
          fetch('http://127.0.0.1:51327/api/reset-fsm', { method: 'POST' });
      });

      document.addEventListener('mouseup', () => {
          resetButton.style.backgroundColor = 'white';
          resetButton.style.color = '#ff4d00';
      });

      pttButton.addEventListener('mousedown', () => {
          if (isRecording) {
              // Switch from Live Mic mode to PTT mode immediately, then start talking.
              modeToggle.checked = true;
              stopRecording();
              updateLiveMicButton();
          }
          isPTT = true;
          pttButton.style.backgroundColor = 'red';
          if (!recognition) {
              navigator.mediaDevices.getUserMedia({ audio: true })
                  .then(stream => {
                      console.log('Microphone access granted');
                      initializeRecognition();
                      recognition.start();
                  })
                  .catch(error => {
                      console.error('Microphone access denied', error);
                      isPTT = false;
                      pttButton.style.backgroundColor = 'lime';
                  });
          } else {
              try { recognition.start(); } catch (e) {}
          }
      });

      document.addEventListener('mouseup', () => {
          if (isPTT) {
              isPTT = false;
              pttButton.style.backgroundColor = 'lime';
              if (recognition) recognition.stop();
          }
      });

      textInput.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
              event.preventDefault(); // don't insert a newline into the textarea
              const text = textInput.value.trim();
              if (text) {
                  sendSpeechText(text);
                  textInput.value = '';
              }
          }
      });

      // Start up the speech listener service
      sendSessionID();
      setInterval(() => { checkSessionID(); }, 2000);
      startRecording(); // default mode (slider left) is Record
      updateLiveMicButton();

    </script>
  </body>
</html>
