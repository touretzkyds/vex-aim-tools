<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech Listener for VEX AIM</title>
    <style>
      .controls-row {
          display: flex;
          align-items: center;
          gap: 12px;
          margin-bottom: 12px;
      }

      .switch-label {
          font-weight: bold;
      }

      .switch {
          position: relative;
          display: inline-block;
          width: 54px;
          height: 28px;
          flex: none;
      }

      .switch input {
          opacity: 0;
          width: 0;
          height: 0;
      }

      .switch .slider {
          position: absolute;
          cursor: pointer;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background-color: red;
          border-radius: 28px;
          transition: background-color .2s;
      }

      .switch .slider:before {
          position: absolute;
          content: "";
          height: 22px;
          width: 22px;
          left: 3px;
          bottom: 3px;
          background-color: white;
          border-radius: 50%;
          transition: transform .2s;
      }

      .switch input:checked + .slider {
          background-color: green;
      }

      .switch input:checked + .slider:before {
          transform: translateX(26px);
      }

      .round-button {
          width: 90px;
          height: 90px;
          border-radius: 50%;
          border: none;
          font-weight: normal;
          font-size: 20px;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          text-align: center;
          line-height: 1.2;
          padding: 4px;
      }

      .live-mic-button {
          border: none;
          background-color: white;
          border-radius: 8px;
          padding: 4px;
          cursor: pointer;
          display: inline-flex;
          flex: none;
      }

      .live-mic-icon {
          height: 80px;
          width: 82px;
          flex: none;
      }

      .ptt-pointer {
          width: 48px;
          height: auto;
          flex: none;
          position: relative;
          z-index: 1;
          transform: translate(-25px, 5px);
      }

      #textInput {
          width: 500px;
          font-size: 16px;
          padding: 4px 8px;
          box-sizing: border-box;
          resize: vertical;
      }
    </style>
  </head>

    </div>
    <textarea id="textInput" placeholder="Type here and press Enter to send..." rows="3"></textarea><p/>
    <div id="result"></div>

    <script>
      const modeToggle = document.getElementById('modeToggle');
      const liveMicButton = document.getElementById('liveMicButton');
      const pttButton = document.getElementById('pttButton');
      const textInput = document.getElementById('textInput');
      const resultDiv = document.getElementById('result');

      let recognition;
      let isRecording = false;
      let isPTT = false;
      let utterance_count = 0;

      // Get the number of milliseconds elapsed since the epoch (timestamp in milliseconds)
      function getTime () {
	  let date = new Date();
	  return date.getTime();
      }
      const sessionID = String(1000 + Math.round(8999 * Math.random())) + String(getTime());

      function sendSessionID() {
          fetch('http://127.0.0.1:51327/api/set-session-id', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ sessionID: sessionID })
          })
      }

      function checkSessionID() {
	  // Make sure we're still the active session.  If not, close the window.
          let response = fetch('http://127.0.0.1:51327/api/get-session-id', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' }
          }).then(response => response.json())
              .then(data => {
                  console.log('Backend response:', data);
		  let currentID = data['sessionID'];
		  if (sessionID != currentID) {
		      closeSession();
		  }
              });
      }

      function closeSession() {
	  try {
	      window.close();
	  } catch (exception) {}
	  window.location.href = 'http://127.0.0.1:51327/listener_closed.html';
      }

      function sendSpeechText(text) {
          utterance_count += 1;
          resultDiv.innerText = `Result ${utterance_count}: ${text}`;
          console.log('Speech result:', text);
          fetch('http://127.0.0.1:51327/api/speech-to-text', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ text: text })
          })
          .then(response => response.json())
          .then(data => { console.log('Backend response:', data); })
          .catch(error => { console.error('Error:', error); });
      }

      function initializeRecognition() {
	  if (! ('webkitSpeechRecognition' in window)) {
	      resultDiv.innerHTML = '<font size=+2 color="red"><b>Speech recognition not supported in this browser!</b></font>';
	      return;
	  };

          recognition = new webkitSpeechRecognition();
          recognition.continuous = true; // Enable continuous recognition
          recognition.interimResults = false;
          recognition.lang = 'en-US';

          recognition.onstart = function () {
              console.log('Speech recognition started');
          };

          recognition.onresult = function (event) {
              const speechResult = event.results[event.resultIndex][0].transcript;
              sendSpeechText(speechResult);
          };

          recognition.onerror = function (event) {
              console.error('Speech recognition error:', event.error);
              if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                  console.error('Microphone access denied');
              }
          };

          recognition.onend = function () {
              console.log('Speech recognition ended');
              if (isRecording || isPTT) {
                  console.log('Restarting speech recognition...');
                  recognition.start(); // Restart recognition if still recording or PTT held
              }
          };
      }

      function updatePTTButton() {
          if (isRecording) {
              pttButton.style.backgroundColor = 'gray';
              pttButton.style.color = '#000'; // black font so label stays visible on gray
          } else {
              pttButton.style.backgroundColor = isPTT ? 'red' : 'lime';
              pttButton.style.color = '#000';
          }
      }

      function startRecording() {
          navigator.mediaDevices.getUserMedia({ audio: true })
              .then(stream => {
                  console.log('Microphone access granted');
                  if (!isRecording) {
                      if (!recognition) initializeRecognition();
                      recognition.start();
                      isRecording = true;
                  }
                  updatePTTButton();
              })
              .catch(error => {
                  console.error('Microphone access denied', error);
                  modeToggle.checked = true; // fall back to Push to Talk mode
                  updateLiveMicButton();
              });
      }

      function stopRecording() {
          if (recognition && isRecording) {
              recognition.stop();
              isRecording = false;
          }
          updatePTTButton();
      }

      function updateLiveMicButton() {
          liveMicButton.style.backgroundColor = modeToggle.checked ? 'white' : 'red';
      }

      modeToggle.addEventListener('change', () => {
          if (modeToggle.checked) {
              // Slid right: Push to Talk mode
              stopRecording();
          } else {
              // Slid left: Record mode
              startRecording();
          }
          updateLiveMicButton();
      });

      liveMicButton.addEventListener('click', () => {
          modeToggle.checked = false;
          modeToggle.dispatchEvent(new Event('change'));
      });

      pttButton.addEventListener('mousedown', () => {
          if (isRecording) {
              // Switch from Live Mic mode to PTT mode immediately, then start talking.
              modeToggle.checked = true;
              stopRecording();
              updateLiveMicButton();
          }
          isPTT = true;
          pttButton.style.backgroundColor = 'red';
          if (!recognition) {
              navigator.mediaDevices.getUserMedia({ audio: true })
                  .then(stream => {
                      console.log('Microphone access granted');
                      initializeRecognition();
                      recognition.start();
                  })
                  .catch(error => {
                      console.error('Microphone access denied', error);
                      isPTT = false;
                      pttButton.style.backgroundColor = 'lime';
                  });
          } else {
              try { recognition.start(); } catch (e) {}
          }
      });

      document.addEventListener('mouseup', () => {
          if (isPTT) {
              isPTT = false;
              pttButton.style.backgroundColor = 'lime';
              if (recognition) recognition.stop();
          }
      });

      textInput.addEventListener('keydown', (event) => {
          if (event.key === 'Enter') {
              event.preventDefault(); // don't insert a newline into the textarea
              const text = textInput.value.trim();
              if (text) {
                  sendSpeechText(text);
                  textInput.value = '';
              }
          }
      });

      // Start up the speech listener service
      sendSessionID();
      setInterval(() => { checkSessionID(); }, 2000);
      startRecording(); // default mode (slider left) is Record
      updateLiveMicButton();

    </script>
